<div class="position-relative">
  <button
    type="button"
    class="btn btn-light position-relative bell"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="store.unreadCount() > 0 ? 'الإشعارات، ' + store.unreadCount() + ' غير مقروء' : 'الإشعارات'"
    (click)="toggle()"
  >
    <i class="bi bi-bell fs-5" aria-hidden="true"></i>
    @if (store.unreadCount() > 0) {
      <span class="badge rounded-pill text-bg-danger count">
        {{ store.unreadCount() > 99 ? '99+' : store.unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div class="panel tm-card" role="region" aria-label="آخر الإشعارات">
      <div class="tm-card-header py-2">
        <span>الإشعارات</span>
        <a routerLink="/notifications" class="small fw-semibold" (click)="open.set(false)">عرض الكل</a>
      </div>

      <div class="list">
        @if (loading()) {
          <tamam-loading variant="skeleton" [rows]="4" class="d-block p-3" />
        } @else {
          @for (item of latest(); track item.id) {
            <a
              class="item"
              [class.unread]="!item.isRead"
              [routerLink]="item.relatedOrderId ? ['/orders', item.relatedOrderId] : ['/notifications']"
              (click)="openItem(item)"
            >
              <span class="tm-icon-box flex-shrink-0"><i class="bi" [class]="icon(item.type)" aria-hidden="true"></i></span>
              <span class="min-w-0">
                <span class="fw-semibold d-block" tamamTooltip>{{ item.title }}</span>
                @if (item.body) {
                  <span class="text-secondary small d-block" tamamTooltip>{{ item.body }}</span>
                }
                <span class="text-secondary small">{{ item.createdAt | tamamDate: 'datetime' }}</span>
              </span>
            </a>
          } @empty {
            <tamam-empty-state icon="bi-bell-slash" title="لا توجد إشعارات" />
          }
        }
      </div>
    </div>
  }
</div>
