<tamam-auth-shell title="أنشئ حساب متجرك" subtitle="ابدأ تجربة مجانية لمدة 14 يومًا">
  <form [formRoot]="registerForm" novalidate>
    @if (serverError(); as message) {
      <div class="alert alert-danger d-flex gap-2" role="alert">
        <i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i>
        <span>{{ message }}</span>
      </div>
    }

    <div class="row">
      <div class="col-sm-6">
        <tamam-field label="اسم النشاط" [field]="registerForm.businessName" [required]="true">
          <input type="text" class="form-control" autocomplete="organization" [formField]="registerForm.businessName" />
        </tamam-field>
      </div>
      <div class="col-sm-6">
        <tamam-field label="اسم المالك" [field]="registerForm.ownerName" [required]="true">
          <input type="text" class="form-control" autocomplete="name" [formField]="registerForm.ownerName" />
        </tamam-field>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <tamam-field label="الدولة" [field]="registerForm.countryCode" [required]="true">
          <select class="form-select" [formField]="registerForm.countryCode">
            <option value="">{{ countriesState() === 'loading' ? 'جارٍ تحميل الدول...' : 'اختر الدولة' }}</option>
            @for (country of countries(); track country.code) {
              <option [value]="country.code">{{ country.nameAr }}</option>
            }
          </select>
          @if (countriesState() === 'error') {
            <div class="small text-danger mt-1" role="alert">
              تعذر تحميل قائمة الدول.
              <button type="button" class="btn btn-link btn-sm p-0 align-baseline" (click)="loadCountries()">إعادة المحاولة</button>
            </div>
          } @else if (countriesState() === 'ready' && countries().length === 0) {
            <div class="small text-danger mt-1" role="alert">لا توجد دول مفعّلة في قاعدة البيانات.</div>
          }
        </tamam-field>
      </div>
      <div class="col-sm-6">
        <tamam-field label="رقم الهاتف" [field]="registerForm.phone" [required]="true">
          <input type="tel" class="form-control" autocomplete="tel" [formField]="registerForm.phone" />
        </tamam-field>
      </div>
    </div>

    <tamam-field label="البريد الإلكتروني" [field]="registerForm.email" [required]="true">
      <input type="email" class="form-control" autocomplete="email" [formField]="registerForm.email" />
    </tamam-field>

    <tamam-field label="كلمة المرور" [field]="registerForm.password" hint="8 أحرف على الأقل" [required]="true">
      <input type="password" class="form-control" autocomplete="new-password" [formField]="registerForm.password" />
    </tamam-field>

    <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="registerForm().submitting()">
      @if (registerForm().submitting()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      إنشاء الحساب
    </button>

    <p class="text-center mt-4 mb-0">لديك حساب؟ <a routerLink="/auth/login" class="fw-bold">سجّل الدخول</a></p>
  </form>
</tamam-auth-shell>
